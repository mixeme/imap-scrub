name: Test

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Run unit tests
        run: go test ./...

  build-scripts:
    name: Build scripts (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            run: bash scripts/build-linux.sh
            artifact: dist/imap-scrub-linux-amd64
          - name: windows
            os: windows-latest
            run: scripts\build-windows.bat
            artifact: dist/imap-scrub-windows-amd64.exe
          - name: macos
            os: ubuntu-latest
            run: bash scripts/build-macos.sh
            artifact: dist/imap-scrub-darwin-amd64
          - name: local
            os: ubuntu-latest
            run: bash scripts/build.sh
            artifact: dist/imap-scrub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Run build script
        run: ${{ matrix.run }}
      - name: Verify artifact exists and is non-empty
        shell: bash
        run: |
          set -eu
          artifact="${{ matrix.artifact }}"
          test -f "$artifact"
          test -s "$artifact"
          ls -la "$artifact"

  nix:
    name: Nix flake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Build flake package
        run: nix build --print-build-logs
      - name: Verify result symlink
        run: |
          set -eu
          test -L result
          test -x result/bin/imap-scrub
          result/bin/imap-scrub --version

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.repository == 'mixeme/imap-scrub'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Run integration tests
        env:
          IMAP_TEST_HOST: ${{ secrets.IMAP_TEST_HOST }}
          IMAP_TEST_USER: ${{ secrets.IMAP_TEST_USER }}
          IMAP_TEST_PASS: ${{ secrets.IMAP_TEST_PASS }}
        run: |
          if [ -z "$IMAP_TEST_HOST" ]; then
            echo "IMAP secrets not configured; skipping integration tests"
            exit 0
          fi
          cat > dev/imap-test.yml <<EOF
          name: IMAP-Scrub Test
          host: ${IMAP_TEST_HOST}
          ssl: true
          port: 993
          user: ${IMAP_TEST_USER}
          pass: ${IMAP_TEST_PASS}
          save_path: /tmp/imap-scrub-test
          use_trash: true
          rules: []
          EOF
          go test -tags=integration ./lib -run TestIntegration -count=1
